# Hält Abhängigkeiten automatisch aktuell: wöchentlich ein Pull Request je Bereich (GitHub Actions, npm-Entwicklungswerkzeuge, Docker-Basisimage).
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly }
  - package-ecosystem: npm
    directory: /
    schedule: { interval: weekly }
  - package-ecosystem: docker
    directory: /
    schedule: { interval: weekly }
