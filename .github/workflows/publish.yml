# Baut das Docker-Image und veröffentlicht es kostenlos in der GitHub Container Registry (ghcr.io/<owner>/<repo>).
name: Publish image
on:
  push:
    branches: [main]
    tags: ["v*"]
permissions:
  contents: read
  packages: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with: { fetch-depth: 0 }   # volle Historie: die Version ist 0.0.<Anzahl Commits>
      - id: ver
        run: echo "count=$(git rev-list --count HEAD)" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-qemu-action@v4      # für das arm64-Image (ARM-Server, z. B. Raspberry Pi)
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=tag
            type=sha
      - uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          build-args: APP_VERSION=0.0.${{ steps.ver.outputs.count }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
