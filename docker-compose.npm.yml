# Ratespaß hinter Nginx Proxy Manager (NPM) mit LOKALEM BUILD (Dockerfile und Quellcode neben dieser Datei). Image aus der eigenen Registry/Dockge: docker-compose.dockge.yml.
# NPM erreicht den Container über ein gemeinsames Docker-Netzwerk (Forward Hostname „ratespass“, Port 3000).
# Zusätzlich wird der Port auf dem Host veröffentlicht (Standard 3007, änderbar per HOST_PORT) – nützlich, wenn NPM nicht im selben Netzwerk hängt
# oder zum direkten Testen. Nur lokal erreichbar: BIND_ADDRESS=127.0.0.1. Gar nicht veröffentlichen: die Zeile `ports:` samt Eintrag löschen.
#
#   1. Netzwerkname von NPM herausfinden:   docker network ls      (oft „npm_default“ oder „<ordner>_default“)
#   2. .env anlegen (Vorlage: .env.example) und NPM_NETWORK, ADMIN_TOKEN (mind. 16 Zeichen), VAPID_SUBJECT setzen (optional HOST_PORT, BIND_ADDRESS)
#   3. Start:                               docker compose -f docker-compose.npm.yml up -d --build
#   4. In NPM einen Proxy Host anlegen: Forward Hostname „ratespass“, Port 3000, Scheme http (siehe docs/DEPLOY.md, Abschnitt C)
services:
  ratespass:
    build: .                                                      # lokal bauen (braucht das Dockerfile und den Quellcode neben dieser Datei)
    image: ${RATESPASS_IMAGE:-ratespass:local}                    # Ohne Quellcode (z. B. Dockge): docker-compose.dockge.yml verwenden
    container_name: ratespass                                     # fester Name = „Forward Hostname“ in NPM
    restart: unless-stopped
    ports:
      - "${BIND_ADDRESS:-0.0.0.0}:${HOST_PORT:-3007}:3000"
    environment:
      ADMIN_TOKEN: ${ADMIN_TOKEN:?bitte in .env setzen (mind. 16 Zeichen, z. B. openssl rand -hex 16)}
      VAPID_SUBJECT: ${VAPID_SUBJECT:?bitte in .env setzen (mailto:… oder https://…)}
      PLAYER_CREATE_LIMIT_PER_HOUR: ${PLAYER_CREATE_LIMIT_PER_HOUR:-60}   # neue Profile pro IP und Stunde
      PLAYER_REPORTS: ${PLAYER_REPORTS:-1}   # 0 = Melde-Knopf für alle Spieler aus
      DUEL_FORFEIT_DAYS: ${DUEL_FORFEIT_DAYS:-3}
      DUEL_REMIND_HOURS: ${DUEL_REMIND_HOURS:-24}
      DUEL_TAKEOVER_HOURS: ${DUEL_TAKEOVER_HOURS:-24}
      # Verantwortlicher für Impressum und Datenschutzerklärung (Pflicht: Name, Anschrift, E-Mail)
      CONTROLLER_NAME: ${CONTROLLER_NAME:-}
      CONTROLLER_ADDRESS: ${CONTROLLER_ADDRESS:-}
      CONTROLLER_EMAIL: ${CONTROLLER_EMAIL:-}
      CONTROLLER_PHONE: ${CONTROLLER_PHONE:-}
      CONTROLLER_REPRESENTATIVE: ${CONTROLLER_REPRESENTATIVE:-}
      CONTROLLER_REGISTER: ${CONTROLLER_REGISTER:-}
      CONTROLLER_VAT_ID: ${CONTROLLER_VAT_ID:-}
      SUPERVISORY_AUTHORITY: ${SUPERVISORY_AUTHORITY:-}
      DPO_CONTACT: ${DPO_CONTACT:-}
      HOSTING_PROVIDER: ${HOSTING_PROVIDER:-}
      PRIVACY_RETENTION_DAYS: ${PRIVACY_RETENTION_DAYS:-730}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}   # KI-Schnittstelle (optional)
      AI_MODEL: ${AI_MODEL:-claude-sonnet-5-5}
      AI_DAILY_LIMIT: ${AI_DAILY_LIMIT:-100}
      AI_AUTO: ${AI_AUTO:-0}
      WORDLE_TZ: ${WORDLE_TZ:-Europe/Berlin}   # Tageswechsel des täglichen Wordle
      TRUST_PROXY: "1"                                            # Client-IP aus X-Forwarded-For (für Rate-Limits)
      PROXY_HOPS: ${PROXY_HOPS:-1}                                # 1 = nur NPM; 2 = Cloudflare-Proxy (orange Wolke) → NPM
    volumes:
      - ratespass-data:/data                                      # Datenbank + VAPID-Schlüssel – regelmäßig sichern
      - ./batches:/app/batches:ro                                 # neue Fragen-Batches (Neustart nötig)
    networks: [proxy]
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]
networks:
  proxy:
    external: true
    name: ${NPM_NETWORK:-npm_default}
volumes:
  ratespass-data:
