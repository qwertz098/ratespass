<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>Ratespaß · Moderation</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <div id="app">
    <div class="top"><h1>Moderation</h1><button class="btn small" id="logout" hidden>Abmelden</button></div>

    <form id="login" class="card stack" hidden autocomplete="on">
      <label class="field">Admin-Token<input id="token" name="token" type="password" autocomplete="current-password" spellcheck="false" required></label>
      <button class="btn primary block" type="submit">Anmelden</button>
      <p class="hint" id="login-msg" role="alert"></p>
    </form>

    <div id="panel" hidden>
      <div class="card stack">
        <div class="row wrap">
          <div class="seg wrap" id="tabs">
            <button data-s="pending" aria-pressed="true">Eingereicht</button><button data-s="disabled" aria-pressed="false">Gemeldet</button>
            <button data-s="review" aria-pressed="false">Überarbeiten <span id="review-count"></span></button><button data-s="search" aria-pressed="false">Suche</button><button data-s="reviewers" aria-pressed="false">Reviewer</button><button data-s="stats" aria-pressed="false">Statistik</button>
          </div>
          <button class="btn small" id="load">Laden</button>
          <button class="btn small" id="export" title="Freigegebene Community-Fragen als Batch-Datei herunterladen und als exportiert markieren">Batch exportieren</button>
          <button class="btn small" id="edits" title="Alle Korrekturen als edits.json herunterladen; mit `npm run apply:edits -- edits.json` in die Batch-Dateien übernehmen">Korrekturen exportieren</button>
        </div>
      </div>
      <form id="searchbar" class="card row wrap" hidden>
        <input id="sq" type="search" placeholder="Text, Antwort oder #ID" maxlength="100">
        <select id="slang"><option value="">alle Sprachen</option><option>de</option><option>en</option></select>
        <select id="sregion"><option value="">alle Regionen</option><option>global</option><option>dach</option></select>
        <button class="btn small primary" type="submit">Suchen</button>
      </form>
      <form id="statbar" class="card row wrap" hidden>
        <select id="stcat"><option value="">alle Kategorien</option></select>
        <select id="stdiff"><option value="">alle Stufen</option><option value="1">leicht</option><option value="2">mittel</option><option value="3">schwer</option></select>
        <input id="stmin" type="number" min="1" value="30" title="Mindestanzahl Antworten" style="width:90px">
        <select id="stsort"><option value="gap">größte Abweichung</option><option value="n">meiste Antworten</option><option value="rate">niedrigste Quote</option></select>
        <button class="btn small primary" type="submit">Anzeigen</button>
      </form>
      <div id="list" class="stack"></div>
      <div id="stats" class="hint"></div>
    </div>
  </div>
  <div id="toast" role="status" aria-live="polite"></div>
  <script type="module" src="/admin.js"></script>
</body>
</html>
