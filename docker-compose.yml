services:
  ratespass:
    build: .
    ports:
      - "3000:3000"
    environment:
      # Moderations-Login unter /admin (fester Benutzer + Passwort); ohne beides ist sie abgeschaltet.
      ADMIN_USER: ${ADMIN_USER:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}   # mind. 12 Zeichen; ohne beides ist /admin abgeschaltet
      # Auf 1 setzen, wenn ein Reverse-Proxy (Caddy/nginx/Traefik) davor steht.
      TRUST_PROXY: ${TRUST_PROXY:-0}
    volumes:
      - ratespass-data:/data
      # Neue Fragen-Batches: Datei hier ablegen und Container neu starten -> wird automatisch importiert.
      - ./batches:/app/batches:ro
    restart: unless-stopped
volumes:
  ratespass-data:
